services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cassio_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cassio_net

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cassio_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "php artisan queue:work --tries=3 --sleep=3 --max-time=3600 &
             php artisan schedule:work"
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - cassio_net

  nginx:
    image: nginx:alpine
    container_name: cassio_nginx
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - cassio_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cassio_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - nginx
    networks:
      - cassio_net

  redis:
    image: redis:7-alpine
    container_name: cassio_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cassio_net

volumes:
  redis_data:

networks:
  cassio_net:
    driver: bridge
